sds-servicedns-cert.yaml:
  resources:
  - '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: servicedns_serving_cert
    tls_certificate:
      certificate_chain:
        filename: /run/servicedns.podcert.ate.dev/credential-bundle.pem
      private_key:
        filename: /run/servicedns.podcert.ate.dev/credential-bundle.pem
      watched_directory:
        path: /run/servicedns.podcert.ate.dev
sds-podidentity-cert.yaml:
  resources:
  - '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: podidentity_client_cert
    tls_certificate:
      certificate_chain:
        filename: /run/podidentity.podcert.ate.dev/credential-bundle.pem
      private_key:
        filename: /run/podidentity.podcert.ate.dev/credential-bundle.pem
      watched_directory:
        path: /run/podidentity.podcert.ate.dev
sds-servicedns-validation.yaml:
  resources:
  - '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: servicedns_validation_context
    validation_context:
      trusted_ca:
        filename: /run/servicedns.podcert.ate.dev/trust-bundle.pem
      watched_directory:
        path: /run/servicedns.podcert.ate.dev
