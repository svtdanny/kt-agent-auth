apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-runner
  namespace: demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: command-runner
  template:
    metadata:
      labels:
        app: command-runner
        auth.demo.dev/egress: enforced
      annotations:
        auth.demo.dev/image-id: sha256:eb6c554e2e8902290e137a55525c7fb9ae95d312d1d3cddd18ffde96dfcc35cf
    spec:
      serviceAccountName: multi-reader
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1337
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: capture
        image: localhost:5001/auth-demo/pod-runner:demo
        imagePullPolicy: Never
        env:
        - name: AUTH_EGRESS_IP
          value: 10.108.113.241
        - name: AUTH_DNS_IP
          value: 10.96.0.10
        command:
        - /bin/sh
        - /app/pod-capture.sh
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
            - NET_RAW
      - name: relay
        image: envoyproxy/envoy:v1.38.6
        restartPolicy: Always
        args:
        - -c
        - /relay/envoy.yaml
        securityContext:
          runAsUser: 1337
          runAsGroup: 1337
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - name: relay
          mountPath: /relay
          readOnly: true
        - name: identity
          mountPath: /identity
          readOnly: true
      containers:
      - name: mastra
        image: localhost:5001/auth-demo/pod-runner:demo
        imagePullPolicy: Never
        command:
        - node
        - /app/agent/server.mjs
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env:
        - name: DEMO_API_ORIGIN
          value: https://catalog-api.demo.svc.cluster.local
        - name: NODE_EXTRA_CA_CERTS
          value: /trust/ca-bundle.pem
        - name: CURL_CA_BUNDLE
          value: /trust/ca-bundle.pem
        volumeMounts:
        - name: trust
          mountPath: /trust
          readOnly: true
      volumes:
      - name: relay
        configMap:
          name: command-runner-relay
      - name: identity
        secret:
          secretName: command-runner-identity
          defaultMode: 288
      - name: trust
        configMap:
          name: pod-egress-trust
