apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-egress
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-egress
  template:
    metadata:
      labels:
        app: agent-egress
    spec:
      serviceAccountName: agent-egress
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
      - name: sdsmint
        image: ${ATENET_IMAGE}
        restartPolicy: Always
        args:
        - sdsmint
        - --uds-path=/var/run/sdsmint/sdsmint.sock
        - --ca-pool-path=/ca/pool
        - --leaf-cert-ttl=15m
        volumeMounts:
        - name: sdsmint-sock
          mountPath: /var/run/sdsmint
          readOnly: false
        - name: egress-mitm-ca-pool
          mountPath: /ca
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
      containers:
      - name: envoy
        image: ${ENVOY_IMAGE}
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --concurrency
        - '2'
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: actor-id-ca-certs
          mountPath: /run/actor-id-ca-certs
          readOnly: true
        - name: config
          mountPath: /etc/envoy
          readOnly: true
        - name: trust
          mountPath: /trust
          readOnly: true
        - name: sdsmint-sock
          mountPath: /var/run/sdsmint
          readOnly: false
        - name: auth-client
          mountPath: /auth-client
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 15090
        ports:
        - containerPort: 8443
      - name: native-egress
        image: ${ATENET_IMAGE}
        args:
        - router
        - --mode=egress
        - --namespace=${NAMESPACE}
        - --port-extproc=50051
        - --extproc-address=127.0.0.1
        - --ateapi-address=dns:///api.${SUBSTRATE_NAMESPACE}.svc:443
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --actor-identity-ca-file=/run/actor-id-ca-certs/ca.crt
        - --otlp-collector-address=
        - --envoy-admin-address=127.0.0.1:15000
        env:
        - name: OTEL_SDK_DISABLED
          value: 'true'
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: actor-id-ca-certs
          mountPath: /run/actor-id-ca-certs
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
      - name: authorizer
        image: ${AUTHORIZER_IMAGE}
        env:
        - name: PROJECT_NAMESPACE
          value: ${NAMESPACE}
        - name: CREDENTIALS_FILE
          value: /credentials/credentials.json
        - name: SSL_CERT_FILE
          value: /trust/upstream-ca.pem
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: authorizer-db
              key: DATABASE_URL
        - name: KAGENT_TARGET
          value: kagent-controller.${KAGENT_NAMESPACE}.svc:8083
        volumeMounts:
        - name: application-credentials
          mountPath: /credentials
          readOnly: true
        - name: trust
          mountPath: /trust
          readOnly: true
        - name: authorizer-tls
          mountPath: /tls
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres-ca
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8444
            scheme: HTTPS
      volumes:
      - name: config
        configMap:
          name: agent-envoy
      - name: trust
        configMap:
          name: upstream-trust
      - name: sdsmint-sock
        emptyDir: {}
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: postgres-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: actor-id-ca-certs
        secret:
          secretName: actor-id-ca-certs
      - name: egress-mitm-ca-pool
        secret:
          secretName: egress-mitm-ca-pool
      - name: auth-client
        secret:
          secretName: auth-client
      - name: authorizer-tls
        secret:
          secretName: authorizer-tls
      - name: application-credentials
        secret:
          secretName: application-credentials
