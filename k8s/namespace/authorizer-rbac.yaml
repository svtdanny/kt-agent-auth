apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-egress
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authorizer-watch
  namespace: ${NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authorizer-watch
  namespace: ${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: agent-egress
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authorizer-watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${NAMESPACE}-reviewer
subjects:
- kind: ServiceAccount
  name: agent-egress
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-auth-reviewer
