# Additions only; scripts/namespace_egress_overlay.py composes these with upstream.
processor:
  name: auth.agent.ext_proc
  typed_config:
    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
    grpc_service:
      envoy_grpc:
        cluster_name: project_authorizer_internal
      timeout: 25s
      initial_metadata:
      - key: x-auth-verified-actor
        value: '%FILTER_STATE(dev.ate.actor.identity:PLAIN)%'
    failure_mode_allow: false
    message_timeout: 25s
    disable_clear_route_cache: true
    request_attributes:
    - xds.filter_chain_name
    - filter_state['dev.ate.actor.identity']
    - filter_state['dev.ate.connect.authority']
    processing_mode:
      request_header_mode: SEND
      response_header_mode: SKIP
      request_body_mode: NONE
      response_body_mode: NONE
      request_trailer_mode: SKIP
      response_trailer_mode: SKIP
    mutation_rules:
      disallow_system: true
      disallow_is_error: true
listener:
  name: project_authorizer_router
  internal_listener: {}
  filter_chains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        stat_prefix: project_authorizer_router
        codec_type: HTTP2
        route_config:
          name: project_authorizer_router
          virtual_hosts:
          - name: authorizers
            domains: ['*']
            routes:
            - match:
                path: /envoy.service.ext_proc.v3.ExternalProcessor/Process
                headers:
                - name: ':method'
                  string_match: {exact: POST}
              route:
                cluster: project_authorizers_dns
                timeout: 25s
        http_filters:
        - name: envoy.filters.http.lua
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code: {inline_string: ''} # Filled from namespace-router.lua.
        - name: envoy.filters.http.dynamic_forward_proxy
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
            dns_cache_config: &dns_cache
              name: project_authorizers_dns
              dns_lookup_family: V4_ONLY
              dns_refresh_rate: 5s
              dns_min_refresh_rate: 1s
              dns_failure_refresh_rate: {base_interval: 1s, max_interval: 5s}
              max_hosts: 4096
        - name: envoy.filters.http.router
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
clusters:
- name: project_authorizer_internal
  type: STATIC
  connect_timeout: 1s
  typed_extension_protocol_options:
    envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
      '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
      explicit_http_config: {http2_protocol_options: {}}
  transport_socket:
    name: envoy.transport_sockets.internal_upstream
    typed_config:
      '@type': type.googleapis.com/envoy.extensions.transport_sockets.internal_upstream.v3.InternalUpstreamTransport
      transport_socket:
        name: envoy.transport_sockets.raw_buffer
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer
  load_assignment:
    cluster_name: project_authorizer_internal
    endpoints:
    - lb_endpoints:
      - endpoint:
          address:
            envoy_internal_address: {server_listener_name: project_authorizer_router}
- name: project_authorizers_dns
  lb_policy: CLUSTER_PROVIDED
  connect_timeout: 2s
  cluster_type:
    name: envoy.clusters.dynamic_forward_proxy
    typed_config:
      '@type': type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
      dns_cache_config: *dns_cache
  typed_extension_protocol_options:
    envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
      '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
      upstream_http_protocol_options: {auto_sni: true, auto_san_validation: true}
      explicit_http_config: {http2_protocol_options: {}}
  transport_socket:
    name: envoy.transport_sockets.tls
    typed_config:
      '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
      common_tls_context:
        tls_params: {tls_minimum_protocol_version: TLSv1_3, tls_maximum_protocol_version: TLSv1_3}
        tls_certificate_sds_secret_configs:
        - name: project_authorizer_client
          sds_config:
            resource_api_version: V3
            path_config_source: {path: /etc/envoy/project-authorizer-client.yaml}
        validation_context_sds_secret_config:
          name: project_authorizer_trust
          sds_config:
            resource_api_version: V3
            path_config_source: {path: /etc/envoy/project-authorizer-trust.yaml}
secrets:
  project-authorizer-client.yaml:
    resources:
    - '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: project_authorizer_client
      tls_certificate:
        certificate_chain: {filename: /auth-router/tls.crt}
        private_key: {filename: /auth-router/tls.key}
        watched_directory: {path: /auth-router}
  project-authorizer-trust.yaml:
    resources:
    - '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: project_authorizer_trust
      validation_context:
        trusted_ca: {filename: /auth-router/ca.crt}
        watched_directory: {path: /auth-router}
