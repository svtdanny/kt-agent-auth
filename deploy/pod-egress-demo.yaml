apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-reader
  namespace: demo
  labels:
    auth.demo.dev/managed: 'true'
  annotations:
    auth.demo.dev/policy-type: permission-set/v1
    auth.demo.dev/policy-config: '{"permissions": [{"id": "catalog-read", "type":
      "http-request/v1", "config": {"origin": "https://catalog-api.demo.svc.cluster.local",
      "methods": ["GET"], "paths": ["/catalog"], "credential": "read-token"}}, {"id":
      "internal-mcp", "type": "http-request/v1", "config": {"origin": "http://mock-mcp.test-services.svc.cluster.local:8080",
      "methods": ["POST"], "paths": ["/mcp"], "credential": "mcp-token"}}]}'
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-egress-config
  namespace: demo
data:
  config.yaml: "frontendPolicies:\n  connect:\n    mode: tunnel\ngateways:\n  pod-egress:\n\
    \    port: 8443\n    bindAddress: $POD_IP\n    protocol: HTTPS\n    tls:\n   \
    \   cert: /tls/tls.crt\n      key: /tls/tls.key\n      root: /tls/ca.crt\nbinds:\n\
    - mode: internal\n  protocol: AUTO\n  listeners:\n  - protocol: HTTPS\n    tls:\n\
    \      mode: dynamicCa\n      cert: /intercept/tls.crt\n      key: /intercept/tls.key\n\
    \    routes:\n    - hostnames:\n      - catalog-api.demo.svc.cluster.local\n \
    \     backends:\n      - host: catalog-api.demo.svc.cluster.local:443\n      \
    \  policies:\n          backendTLS:\n            root: /tls/ca.crt\n      policies:\n\
    \        extProc:\n          host: auth-ext-proc.demo.svc.cluster.local:50051\n\
    \          failureMode: failClosed\n          policies:\n            backendTLS:\n\
    \              root: /run/auth-extproc/ca.crt\n              cert: /run/auth-extproc/tls.crt\n\
    \              key: /run/auth-extproc/tls.key\n          processingOptions:\n\
    \            requestHeaderMode: send\n            requestBodyMode: none\n    \
    \        responseHeaderMode: skip\n            responseBodyMode: none\n      \
    \      requestTrailerMode: skip\n            responseTrailerMode: skip\n     \
    \     requestAttributes:\n            actorSpiffeId: source.spiffeId\n       \
    \     destinationPort: destination.port\n            scheme: '\"https\"'\n  -\
    \ protocol: HTTP\n    routes:\n    - hostnames:\n      - mock-mcp.test-services.svc.cluster.local\n\
    \      backends:\n      - host: mock-mcp.test-services.svc.cluster.local:8080\n\
    \      policies:\n        extProc:\n          host: auth-ext-proc.demo.svc.cluster.local:50051\n\
    \          failureMode: failClosed\n          policies:\n            backendTLS:\n\
    \              root: /run/auth-extproc/ca.crt\n              cert: /run/auth-extproc/tls.crt\n\
    \              key: /run/auth-extproc/tls.key\n          processingOptions:\n\
    \            requestHeaderMode: send\n            requestBodyMode: none\n    \
    \        responseHeaderMode: skip\n            responseBodyMode: none\n      \
    \      requestTrailerMode: skip\n            responseTrailerMode: skip\n     \
    \     requestAttributes:\n            actorSpiffeId: source.spiffeId\n       \
    \     destinationPort: destination.port\n            scheme: '\"http\"'\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: demo
  name: pod-egress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pod-egress
  template:
    metadata:
      labels:
        app: pod-egress
      annotations:
        auth.demo.dev/image-id: sha256:c53455588f1919ddd4cffa11ddc46e675f342e7769b9852b594f270297f95706
        auth.demo.dev/config-hash: 411908616849881007d48b3ecf9f13c3dfe153a5caed27962fa08737cc098913
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
      - name: tls
        secret:
          secretName: pod-egress-tls
      - name: config
        configMap:
          name: pod-egress-config
      - name: processor
        secret:
          secretName: auth-pod-gateway-client
      - name: intercept
        secret:
          secretName: auth-pod-intercept-ca
      containers:
      - name: pod-egress
        image: ghcr.io/kagent-dev/substrate/agentgateway:3554db38a0b2@sha256:309f6811560635471958db67b0f68dd083d84048dffc681967599d159ebfc83d
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: config
          mountPath: /config
          readOnly: true
        - name: processor
          mountPath: /run/auth-extproc
          readOnly: true
        - name: intercept
          mountPath: /intercept
          readOnly: true
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 15021
          periodSeconds: 2
        command:
        - /app/agentgateway
        args:
        - -f
        - /config/config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: pod-egress
  namespace: demo
spec:
  selector:
    app: pod-egress
  ports:
  - port: 8443
    targetPort: 8443
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-services
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-mcp
  namespace: test-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: test-services
  name: mock-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mock-mcp
  template:
    metadata:
      labels:
        app: mock-mcp
      annotations:
        auth.demo.dev/image-id: sha256:3a58ff156af2a448b69bdb85ba2520b98a2a8eff072747e0721d10da52b5e2a3
    spec:
      serviceAccountName: mock-mcp
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
      - name: vault-ca
        secret:
          secretName: auth-control-plane-tls
          items:
          - key: ca.crt
            path: ca.crt
      - name: vault-identity
        projected:
          sources:
          - serviceAccountToken:
              audience: vault
              expirationSeconds: 3600
              path: token
      containers:
      - name: mock-mcp
        image: localhost:5001/auth-demo/test-api:demo
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: vault-ca
          mountPath: /run/vault-ca
          readOnly: true
        - name: vault-identity
          mountPath: /var/run/vault-identity
          readOnly: true
        env:
        - name: VAULT_ADDR
          value: https://auth-vault.demo.svc.cluster.local:8200
        - name: VAULT_CACERT
          value: /run/vault-ca/ca.crt
        - name: VAULT_ROLE
          value: auth-mcp
        - name: VAULT_KV_MOUNT
          value: kv
        - name: VAULT_KV_PREFIX
          value: auth-demo
        - name: VAULT_JWT_PATH
          value: /var/run/vault-identity/token
        - name: MOCK_PLAINTEXT
          value: 'true'
        - name: MOCK_READER_REF
          value: mock/mcp-reader
        - name: MOCK_WRITER_REF
          value: mock/mcp-writer
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mock-mcp
  namespace: test-services
spec:
  selector:
    app: mock-mcp
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: command-runner-relay
  namespace: demo
data:
  envoy.yaml: "static_resources:\n  listeners:\n  - name: capture\n    address:\n\
    \      socket_address:\n        address: 127.0.0.1\n        port_value: 15001\n\
    \    listener_filters:\n    - name: envoy.filters.listener.original_dst\n    \
    \  typed_config:\n        '@type': type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst\n\
    \    filter_chains:\n    - filters:\n      - name: envoy.filters.network.tcp_proxy\n\
    \        typed_config:\n          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy\n\
    \          stat_prefix: enrolled_pod\n          cluster: dedicated_egress\n  \
    \        tunneling_config:\n            hostname: '%DOWNSTREAM_LOCAL_ADDRESS%'\n\
    \          access_log:\n          - name: envoy.access_loggers.stdout\n      \
    \      typed_config:\n              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog\n\
    \              log_format:\n                text_format_source:\n            \
    \      inline_string: 'captured %DOWNSTREAM_LOCAL_ADDRESS% %RESPONSE_FLAGS%\n\n\
    \                    '\n  clusters:\n  - name: dedicated_egress\n    type: STRICT_DNS\n\
    \    connect_timeout: 5s\n    dns_lookup_family: V4_ONLY\n    load_assignment:\n\
    \      cluster_name: dedicated_egress\n      endpoints:\n      - lb_endpoints:\n\
    \        - endpoint:\n            address:\n              socket_address:\n  \
    \              address: pod-egress.demo.svc.cluster.local\n                port_value:\
    \ 8443\n    typed_extension_protocol_options:\n      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:\n\
    \        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions\n\
    \        explicit_http_config:\n          http_protocol_options: {}\n    transport_socket:\n\
    \      name: envoy.transport_sockets.tls\n      typed_config:\n        '@type':\
    \ type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext\n\
    \        sni: pod-egress.demo.svc.cluster.local\n        common_tls_context:\n\
    \          alpn_protocols:\n          - http/1.1\n          tls_certificates:\n\
    \          - certificate_chain:\n              filename: /identity/tls.crt\n \
    \           private_key:\n              filename: /identity/tls.key\n        \
    \  validation_context:\n            trusted_ca:\n              filename: /identity/ca.crt\n\
    \            match_typed_subject_alt_names:\n            - san_type: DNS\n   \
    \           matcher:\n                exact: pod-egress.demo.svc.cluster.local\n"
---
