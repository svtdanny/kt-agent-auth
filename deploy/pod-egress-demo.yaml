apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-reader
  namespace: demo
  labels:
    auth.demo.dev/managed: 'true'
  annotations:
    auth.demo.dev/policy-type: permission-set/v1
    auth.demo.dev/policy-config: '{"permissions": [{"id": "catalog-read", "type":
      "http-request/v1", "config": {"origin": "https://catalog-api.demo.svc.cluster.local",
      "methods": ["GET"], "paths": ["/catalog"], "credential": "read-token"}}, {"id":
      "internal-mcp", "type": "http-request/v1", "config": {"origin": "http://mock-mcp.test-services.svc.cluster.local:8080",
      "methods": ["POST"], "paths": ["/mcp"], "credential": "mcp-token"}}, {"id":
      "external-read", "type": "http-request/v1", "config": {"origin": "https://external-api.auth-demo.test:8443",
      "methods": ["GET"], "paths": ["/external"], "credential": "external-token"}}]}'
automountServiceAccountToken: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-services
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-mcp
  namespace: test-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: test-services
  name: mock-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mock-mcp
  template:
    metadata:
      labels:
        app: mock-mcp
      annotations:
        auth.demo.dev/image-id: sha256:18d387ef6493ef5f4e75233fbb9c75afa52cf1dfc1ed7145f4de7475e10cf506
    spec:
      serviceAccountName: mock-mcp
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
      - name: vault-ca
        secret:
          secretName: auth-control-plane-tls
          items:
          - key: ca.crt
            path: ca.crt
      - name: vault-identity
        projected:
          sources:
          - serviceAccountToken:
              audience: vault
              expirationSeconds: 3600
              path: token
      containers:
      - name: mock-mcp
        image: localhost:5001/auth-demo/test-api:demo
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: vault-ca
          mountPath: /run/vault-ca
          readOnly: true
        - name: vault-identity
          mountPath: /var/run/vault-identity
          readOnly: true
        env:
        - name: VAULT_ADDR
          value: https://auth-vault.demo.svc.cluster.local:8200
        - name: VAULT_CACERT
          value: /run/vault-ca/ca.crt
        - name: VAULT_ROLE
          value: auth-mcp
        - name: VAULT_KV_MOUNT
          value: kv
        - name: VAULT_KV_PREFIX
          value: auth-demo
        - name: VAULT_JWT_PATH
          value: /var/run/vault-identity/token
        - name: MOCK_PLAINTEXT
          value: 'true'
        - name: MOCK_READER_REF
          value: mock/mcp-reader
        - name: MOCK_WRITER_REF
          value: mock/mcp-writer
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mock-mcp
  namespace: test-services
spec:
  selector:
    app: mock-mcp
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: command-runner-relay
  namespace: demo
data:
  envoy.yaml: "static_resources:\n  listeners:\n  - name: capture\n    address:\n\
    \      socket_address:\n        address: 127.0.0.1\n        port_value: 15001\n\
    \    listener_filters:\n    - name: envoy.filters.listener.original_dst\n    \
    \  typed_config:\n        '@type': type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst\n\
    \    filter_chains:\n    - filters:\n      - name: envoy.filters.network.tcp_proxy\n\
    \        typed_config:\n          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy\n\
    \          stat_prefix: enrolled_pod\n          cluster: dedicated_egress\n  \
    \        tunneling_config:\n            hostname: '%DOWNSTREAM_LOCAL_ADDRESS%'\n\
    \          access_log:\n          - name: envoy.access_loggers.stdout\n      \
    \      typed_config:\n              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog\n\
    \              log_format:\n                text_format_source:\n            \
    \      inline_string: 'captured %DOWNSTREAM_LOCAL_ADDRESS% %RESPONSE_FLAGS%\n\
    \                    %UPSTREAM_TRANSPORT_FAILURE_REASON%\n\n                 \
    \   '\n  clusters:\n  - name: dedicated_egress\n    type: STRICT_DNS\n    connect_timeout:\
    \ 5s\n    dns_lookup_family: V4_ONLY\n    load_assignment:\n      cluster_name:\
    \ dedicated_egress\n      endpoints:\n      - lb_endpoints:\n        - endpoint:\n\
    \            address:\n              socket_address:\n                address:\
    \ atenet-egress.ate-system.svc.cluster.local\n                port_value: 8443\n\
    \    typed_extension_protocol_options:\n      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:\n\
    \        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions\n\
    \        explicit_http_config:\n          http_protocol_options: {}\n    transport_socket:\n\
    \      name: envoy.transport_sockets.tls\n      typed_config:\n        '@type':\
    \ type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext\n\
    \        sni: atenet-egress.ate-system.svc\n        common_tls_context:\n    \
    \      alpn_protocols:\n          - http/1.1\n          tls_params:\n        \
    \    tls_minimum_protocol_version: TLSv1_3\n            tls_maximum_protocol_version:\
    \ TLSv1_3\n          tls_certificates:\n          - certificate_chain:\n     \
    \         filename: /identity/tls.crt\n            private_key:\n            \
    \  filename: /identity/tls.key\n          validation_context:\n            trusted_ca:\n\
    \              filename: /identity/ca.crt\n            match_typed_subject_alt_names:\n\
    \            - san_type: DNS\n              matcher:\n                exact: atenet-egress.ate-system.svc\n"
---
