apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${CALLER}
  namespace: ${NAMESPACE}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: select-agent-account
  namespace: ${NAMESPACE}
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  resourceNames:
  - agent-caller
  verbs:
  - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: select-agent-account
  namespace: ${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: ${CALLER}
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: select-agent-account
