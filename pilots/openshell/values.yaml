# OpenShell v0.1.5, isolated openshell-pilot Minikube cluster.
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: '1', memory: 512Mi}
gatewayConfig:
  openshell.gateway:
    config_delivery_mode: push
supervisor:
  image:
    registry: localhost:5001
    repository: auth-demo/openshell-supervisor
    tag: demo
    pullPolicy: Never
sandbox:
  image:
    repository: localhost:5001/auth-demo/openshell-mastra
    tag: demo
    pullPolicy: Never
